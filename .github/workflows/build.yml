name: Build APK

# Runs on every push to master, and can also be triggered by hand
# from the Actions tab (the "Run workflow" button).
on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Needed so the job can create a Release and upload the APK to it.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Provides a known Gradle on PATH so we can generate the wrapper.
      # The wrapper jar is a binary we deliberately did NOT commit, so this
      # step recreates it (jar included) — nothing binary lives in the repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Version scheme:
      #   VERSION_CODE = run number (unique, always increasing -> Android upgrades cleanly)
      #   VERSION_NAME = major.minor.patch, tracked via git tags (v1.2.3)
      #
      # Adding a new ./release-notes/vX.Y.0.md file in this push bumps the
      # minor/major version to X.Y.0 and creates a GitHub Release using that
      # file as the release body. Any other push just bumps the patch number
      # (e.g. 1.2.3 -> 1.2.4) and only produces a build artifact, no release.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE="${{ github.event.before }}"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF_BASE="HEAD~1"
          else
            DIFF_BASE=""
          fi

          NEW_NOTE=""
          if [ -n "$DIFF_BASE" ]; then
            NEW_NOTE=$(git diff --name-status --diff-filter=A "$DIFF_BASE" HEAD -- 'release-notes/v*.md' | awk '{print $2}' | sort -V | tail -n1)
          fi

          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)

          if [ -n "$NEW_NOTE" ]; then
            VERSION=$(basename "$NEW_NOTE" .md | sed 's/^v//')
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$NEW_NOTE is not named vX.Y.Z.md"
              exit 1
            fi
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            if [ "$PATCH" != "0" ]; then
              echo "::error::Release notes are only for minor/major bumps - $NEW_NOTE must end in .0"
              exit 1
            fi
            if [ "v$VERSION" = "$LATEST_TAG" ]; then
              echo "::error::v$VERSION ($NEW_NOTE) is already the latest tag"
              exit 1
            fi
            IS_RELEASE=true
            NOTES_FILE="$NEW_NOTE"
          else
            if [ -z "$LATEST_TAG" ]; then
              VERSION="1.0.0"
            else
              BASE=${LATEST_TAG#v}
              MAJOR=$(echo "$BASE" | cut -d. -f1)
              MINOR=$(echo "$BASE" | cut -d. -f2)
              PATCH=$(echo "$BASE" | cut -d. -f3)
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            IS_RELEASE=false
            NOTES_FILE=""
          fi

          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/AiSCheck-v${{ steps.version.outputs.name }}.apk"

      # Keep the artifact too, so it's downloadable even on manual/patch runs
      # that don't produce a release.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiSCheck-v${{ steps.version.outputs.name }}
          path: dist/AiSCheck-v${{ steps.version.outputs.name }}.apk
          if-no-file-found: error

      # Every build gets a version tag, so the next run can work out the next
      # patch number - but only minor/major bumps (with release notes) get an
      # actual GitHub Release further down.
      - name: Tag version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.name }}"
          git push origin "v${{ steps.version.outputs.name }}"

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: AiSCheck v${{ steps.version.outputs.name }}
          body_path: ${{ steps.version.outputs.notes_file }}
          files: dist/AiSCheck-v${{ steps.version.outputs.name }}.apk
          make_latest: true