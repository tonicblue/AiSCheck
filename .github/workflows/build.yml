name: Build APK

# Runs on every push to main, and can also be triggered by hand
# from the Actions tab (the "Run workflow" button).
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Provides a known Gradle on PATH so we can generate the wrapper.
      # The wrapper jar is a binary we deliberately did NOT commit, so this
      # step recreates it (jar included) — nothing binary lives in the repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AiSCheck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-file-found: error
